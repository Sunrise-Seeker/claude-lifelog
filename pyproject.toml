[project]
name = "claude-lifelog"
version = "0.1.0"
description = "AI-powered personal lifelog plugin for Claude Code — captures daily thoughts, feelings, and life events from conversations"
authors = [{ name = "ljiaxiang922" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
claude-lifelog = "claude_lifelog.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_lifelog"]
